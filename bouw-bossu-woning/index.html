<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Stel je woning samen | Bouw Bossu</title>
<meta name="description" content="Stel je nieuwe woning samen op je eigen bouwgrond: gevel, dak, ramen, oprit, tuin en interieur.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{--acc:#C30B30;--acc-d:#a3082a;--ink:#2E363C;--ink2:#4a5464;--mut:#728197;--lijn:#dcdfe5;--papier:#fff;--papier2:#f4f5f7;--font:'Ubuntu',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--papier2);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.kop{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:22px;padding:0 22px;background:#fff;border-bottom:1px solid var(--lijn);z-index:20}
.logo svg{height:24px;width:auto;display:block}
.kopt{display:flex;flex-direction:column;line-height:1.2;border-left:1px solid var(--lijn);padding-left:22px}
.kopt b{font-size:15px}.kopt span{font-size:12.5px;color:var(--mut)}.kopt em{font-style:normal;color:var(--acc);font-weight:700}
.app{position:fixed;top:64px;left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) 440px}
.beeld{position:relative;overflow:hidden;background:#cfd8df}
#scene{width:100%;height:100%;display:block;touch-action:none}
.views{position:absolute;left:16px;top:16px;display:flex;gap:6px;flex-wrap:wrap}
.views button{border:0;background:rgba(255,255,255,.92);padding:8px 13px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.views button.aan{background:var(--ink);color:#fff}
#fotoknop{background:var(--acc);color:#fff}
.zon{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);padding:8px 14px;border-radius:999px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.zon input{width:160px;accent-color:var(--acc)}.zon b{min-width:44px;font-variant-numeric:tabular-nums}
.fotoview{position:absolute;inset:0;margin:0;background:#111;display:flex;align-items:center;justify-content:center}
.fotoview[hidden]{display:none}
.fotoview img{width:100%;height:100%;object-fit:cover;animation:in .5s ease}
@keyframes in{from{opacity:.3;transform:scale(1.02)}to{opacity:1;transform:none}}
.fotoview figcaption{position:absolute;left:20px;bottom:64px;color:#fff;background:rgba(20,24,28,.62);backdrop-filter:blur(6px);padding:10px 14px;border-radius:10px;font-size:14px}
.fotoview figcaption span{display:block;font-size:12px;opacity:.75}
.fotoview .chips{position:absolute;left:20px;right:20px;bottom:18px;display:flex;gap:6px;flex-wrap:wrap}
.fotoview .chips span{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border-radius:999px;padding:5px 11px 5px 6px;font-size:12px}
.fotoview .chips i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
body[data-scherm=interieur] .zon{display:none}body[data-scherm=interieur] .views{display:none}

.paneel{min-width:0;display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--lijn);min-height:0}
.stappen{display:flex;gap:4px;padding:12px 14px 8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--lijn)}
.stappen::-webkit-scrollbar{display:none}
.stapknop{flex:none;border:0;background:none;padding:6px 9px;border-radius:8px;font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.stapknop span{width:19px;height:19px;border-radius:50%;background:var(--papier2);display:grid;place-items:center;font-size:11px;font-weight:700}
.stapknop.actief{color:var(--ink);background:var(--papier2)}.stapknop.actief span{background:var(--acc);color:#fff}
.stapknop.klaar span{background:var(--ink);color:#fff}
.stapknop:disabled{opacity:.4;cursor:default}
h1{font-size:22px;margin:16px 22px 4px;font-weight:700;letter-spacing:-.01em}
.inhoud{flex:1;overflow-y:auto;padding:4px 22px 24px}
.lede{color:var(--ink2);margin:6px 0 14px}
.groep{padding:14px 0;border-bottom:1px solid var(--papier2)}
.glabel{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.glabel b{color:var(--acc)}
.ginfo{font-size:12.5px;color:var(--mut);margin:-4px 0 8px}
input[type=range]{width:100%;accent-color:var(--acc)}
.stalen{display:flex;flex-wrap:wrap;gap:8px}
.staal{width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:var(--c);box-shadow:0 0 0 1px var(--lijn);padding:0;display:grid;place-items:center;transition:transform .15s}
.staal i{font-style:normal;color:var(--mut)}
.staal:hover{transform:scale(1.08)}
.staal.aan{box-shadow:0 0 0 2px var(--acc)}
.gekozen{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}.gekozen span{color:var(--mut)}
.tegels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tegel{border:1px solid var(--lijn);background:#fff;border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,box-shadow .15s}
.tegel:hover{border-color:var(--mut)}
.tegel.aan{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tegel b{font-size:13.5px}.tegel small{font-size:12px;color:var(--mut);line-height:1.3}.tegel em{font-style:normal;font-size:12px;color:var(--ink2);margin-top:4px}
.tegel i{width:22px;height:22px;border-radius:50%;margin-bottom:4px;border:1px solid rgba(0,0,0,.1)}
.tegels.foto .tegel{padding:0;overflow:hidden}
.tegels.fotoview img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--papier2)}
.tegels.foto b,.tegels.foto small,.tegels.foto em{padding:0 10px}.tegels.foto b{padding-top:8px}.tegels.foto .tegel>:last-child{padding-bottom:10px}
.lijst{display:flex;flex-direction:column;gap:6px}
.rij{display:flex;align-items:center;gap:10px;border:1px solid var(--lijn);border-radius:9px;padding:9px 11px;font-size:13.5px;cursor:pointer}
.rij.aan{border-color:var(--acc);background:#fdf6f7}
.rij input{accent-color:var(--acc);margin:0}
.rij span{flex:1}.rij small{color:var(--mut)}.rij em{font-style:normal;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.ruimtes{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 2px}
.ruimtes button{border:1px solid var(--lijn);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px}
.ruimtes button.aan{background:var(--ink);color:#fff;border-color:var(--ink)}
.zoek{position:relative;display:flex;gap:8px}
.zoek input{flex:1;min-width:0;width:100%;border:1px solid var(--lijn);border-radius:10px;padding:12px 13px;font:inherit}
.zoek input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.sugg{position:absolute;top:100%;left:0;right:70px;background:#fff;border:1px solid var(--lijn);border-radius:10px;margin-top:4px;z-index:5;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.sugg:empty{display:none}
.sugg button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:9px 12px;font-size:13.5px}.sugg button:hover{background:var(--papier2)}
.link{border:0;background:none;color:var(--acc);padding:10px 0;font-size:13px;text-align:left;text-decoration:underline;text-underline-offset:3px}
.kaart{background:var(--papier2);border-radius:12px;padding:6px 14px;margin:10px 0}
.kv{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e6e8ec;font-size:13px}
.kv:last-child{border-bottom:0}.kv span{color:var(--mut)}.kv b{text-align:right;font-weight:500}.kv em{font-style:normal;color:var(--ink2);min-width:84px;text-align:right}
.noot{font-size:12px;color:var(--mut)}
.fout{background:#fdecef;color:var(--acc-d);border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0}
.laden{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);margin:10px 0}
.laden i{width:16px;height:16px;border-radius:50%;border:2px solid var(--lijn);border-top-color:var(--acc);animation:draai .8s linear infinite}
@keyframes draai{to{transform:rotate(360deg)}}
.voet{border-top:1px solid var(--lijn);padding:12px 22px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff}
.prijs{display:flex;flex-direction:column;line-height:1.2}
.prijs small{font-size:11.5px;color:var(--mut)}.prijs b{font-size:20px}.prijs span{font-size:11px;color:var(--mut)}
.knoppen{display:flex;gap:8px}
.knop{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:11px 18px;font-weight:500;white-space:nowrap}
.knop:hover{background:var(--acc-d)}.knop:disabled{opacity:.4;cursor:default}
.knop.licht{background:var(--papier2);color:var(--ink)}
.knop.groot{width:100%;padding:14px}
.totaal{background:var(--ink);color:#fff;border-radius:14px;padding:16px 18px;margin:8px 0 12px;display:flex;flex-direction:column}
.totaal small{opacity:.7;font-size:12px}.totaal b{font-size:28px}.totaal span{font-size:12px;opacity:.65}
.snap{width:100%;border-radius:12px;display:block;aspect-ratio:16/10;object-fit:cover;background:var(--papier2)}
.form{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.form input,.form select,.form textarea{border:1px solid var(--lijn);border-radius:10px;padding:11px 12px;font:inherit;background:#fff}
.check{display:flex;gap:8px;font-size:12.5px;color:var(--ink2);align-items:flex-start}.check input{accent-color:var(--acc);margin-top:3px}
.dank{background:#eef7f1;border-radius:12px;padding:16px}.dank p{margin:6px 0 0;font-size:14px}
@media (max-width:900px){
  .kop{height:56px;padding:0 14px;gap:12px}.kopt{padding-left:12px}.kopt span{display:none}.logo svg{height:19px}
  .app{top:56px;grid-template-columns:minmax(0,1fr);grid-template-rows:40vh minmax(0,1fr)}
  .paneel{border-left:0;border-top:1px solid var(--lijn)}
  h1{font-size:19px;margin:12px 16px 2px}.inhoud{padding:2px 16px 20px}.voet{padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .views{left:10px;top:10px}.views button{padding:6px 10px;font-size:12px}
  .zon{left:10px;bottom:10px;padding:6px 10px}.zon input{width:110px}
  .prijs b{font-size:17px}.prijs span{display:none}.knop{padding:10px 14px}
  .fotoview figcaption{bottom:50px;left:10px;font-size:13px}.fotoview .chips{left:10px;bottom:10px;display:none}
}
@media print{.kop,.beeld,.stappen,.voet,.form,.link{display:none!important}.app{position:static;display:block}.inhoud{overflow:visible}}
.melding{position:absolute;right:16px;top:16px;max-width:320px;background:#fff;border-left:3px solid var(--acc);border-radius:8px;padding:10px 12px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.1)}.melding[hidden]{display:none}
body[data-scherm=interieur] .melding{display:none}
@media (max-width:900px){.melding{left:10px;right:10px;top:auto;bottom:52px;max-width:none}}
.inhoud,.groep,.lijst,.tegels{min-width:0}.tegel{min-width:0}
</style>

<main class="app">

    <div class="views">
