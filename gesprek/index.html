<!doctype html>
<html lang="nl-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gesprekshulp</title>
<style>
@font-face{font-family:Satoshi;src:url(f/Satoshi-Regular.otf);font-weight:400}
@font-face{font-family:Satoshi;src:url(f/Satoshi-Medium.otf);font-weight:500}
@font-face{font-family:Satoshi;src:url(f/Satoshi-Bold.otf);font-weight:700}
@font-face{font-family:MontThin;src:url(f/Montserrat-Thin.ttf);font-weight:100}
:root{--bg:#131313;--panel:rgba(237,233,227,.06);--panel2:#3C3B39;--ink:#EDE9E3;--soft:rgba(237,233,227,.62);--line:rgba(237,233,227,.14);--accent:#F87759;--ok:#EDE9E3;--rec:#F87759;--hl:rgba(237,233,227,.09);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Satoshi,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(19,19,19,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:2}
header h1{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;margin:0 14px 0 0;letter-spacing:-.2px}
header h1 img{height:36px;width:auto}
header h1 span{font:100 15px MontThin,sans-serif;letter-spacing:5px;color:var(--ink);text-transform:uppercase}
button{font:500 14px Satoshi,system-ui,sans-serif;border-radius:999px;padding:9px 16px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#131313;font-weight:700}
button.stop{background:var(--panel2);border-color:var(--panel2);color:var(--ink)}
#status{font-size:13px;color:var(--soft);margin-left:auto;max-width:100%}
#status.on::before{content:"● ";color:var(--rec)}
main{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;padding:16px 20px;max-width:1400px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
h2{font:700 11.5px Satoshi,sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h2+*{margin-top:0}
.gap{margin-top:18px}
.card{background:var(--hl);border-radius:14px;padding:11px 14px;margin-bottom:8px;font-size:17px;font-weight:500}
.card.say{border-left:3px solid var(--accent)}
ul{margin:0;padding-left:18px}li{margin-bottom:4px}
#done li{color:var(--ok)}
#done li::marker{color:var(--accent)}
#tip{font-size:14px;color:var(--soft)}
#transcript{height:44vh;overflow:auto;white-space:pre-wrap;font-size:14px;border:1px solid var(--line);border-radius:14px;padding:12px}
#transcript time{color:var(--accent);font:12px ui-monospace,monospace;margin-right:6px}
#interim{color:var(--soft);font-style:italic}
textarea,input,select{width:100%;font:14px/1.45 Satoshi,system-ui,sans-serif;border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(237,233,227,.04);color:var(--ink)}
select option{background:#131313}
textarea:focus,input:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
textarea{resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
details{margin:16px 20px 0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 18px;max-width:1360px}
@media(min-width:1400px){details{margin-left:auto;margin-right:auto}}
summary{cursor:pointer;font-weight:700}
label{font-size:13px;color:var(--soft);display:block;margin:12px 0 4px}
small{color:var(--soft)}
input[type=checkbox]{accent-color:var(--accent)}
</style></head><body>
<header>
  <h1><img src="f/logo.png" alt="Cohezy"><span>Gesprekshulp</span></h1>
  <button class="primary" id="start">Start opname</button>
  <button class="stop" id="stop" disabled>Stop</button>
  <button id="now">Wat nu?</button>
  <label style="margin:0;display:flex;gap:6px;align-items:center;width:auto"><input type="checkbox" id="auto" checked style="width:auto"> automatisch elke</label>
  <select id="every" style="width:auto"><option value="60">1 min</option><option value="90" selected>1,5 min</option><option value="150">2,5 min</option></select>
  <label style="margin:0;display:flex;gap:6px;align-items:center;width:auto">tekst elke</label>
  <select id="chunk" style="width:auto"><option value="10">10 s</option><option value="15">15 s</option><option value="30">30 s</option></select>
  <span id="status">Niet aan het opnemen</span>
</header>

<details id="setup">
  <summary>Instellingen en briefing</summary>
  <label for="key">Groq-sleutel (blijft enkel op deze laptop bewaard)</label>
  <input id="key" type="password" autocomplete="off" placeholder="gsk_...">
  <label for="model">Model</label>
  <select id="model"><option value="openai/gpt-oss-120b" selected>GPT-OSS 120B (slimst)</option><option value="llama-3.3-70b-versatile">Llama 3.3 70B</option></select>
  <label for="words">Moeilijke woorden voor het uitschrijven (namen, vaktermen)</label>
  <input id="words" placeholder="Luka Casier, Care2Cover, Dean, Nico, spuitkurk, crepi, kalei, steenstrips, gevelisolatie, configurator, Webflow">
  <label for="klant">Klant-ID voor de opslag in Google Sheets (één woord, bv. care2cover)</label>
  <input id="klant">
  <label for="who">Klant (wie zit er tegenover je, bv. Dean en Nico van Care2Cover)</label>
  <input id="who">
  <label for="brief">Briefing: wie is het bedrijf, wat bieden we aan, welke vragen willen we zeker stellen, prijzen</label>
  <textarea id="brief" rows="12" placeholder="Plak hier de briefing van het bedrijf."></textarea>
  <div class="row"><button id="save">Bewaar</button><button id="clear">Nieuw gesprek (wist de tekst)</button><small id="saved"></small></div>
</details>

<main>
  <div>
    <section>
      <h2>Vraag nu</h2>
      <div id="next"><div class="card">Vul de briefing in en druk op "Wat nu?" voor de eerste vragen.</div></div>
      <h2 class="gap">Zeg nu</h2>
      <div id="say"></div>
      <p id="tip"></p>
    </section>
    <section class="gap" style="margin-top:14px">
      <h2>Wat we al weten</h2>
      <ul id="facts"><li><small>Nog niets.</small></li></ul>
      <h2 class="gap">Al beantwoord</h2>
      <ul id="done"><li><small>Nog niets.</small></li></ul>
      <h2 class="gap">Nog open (belangrijk)</h2>
      <ul id="open"><li><small>Nog niets.</small></li></ul>
    </section>
  </div>
  <section>
    <h2>Gesprek</h2>
    <div id="transcript"><span id="interim"></span></div>
    <label for="note">Eigen notitie of tekst uit Wispr plakken</label>
    <textarea id="note" rows="3" placeholder="bv. Dean: 40 aanvragen per maand, de helft rijdt voor niets"></textarea>
    <div class="row"><button id="addnote">Toevoegen</button><button id="copyall">Kopieer alles</button><button id="dl">Download .txt</button></div>
    <small id="sync" style="display:block;margin-top:8px"></small>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
let lines=[];try{lines=JSON.parse(LS.get("gh-lines","[]"));}catch(e){}
let result={};try{result=JSON.parse(LS.get("gh-result","{}"));}catch(e){}
$("key").value=LS.get("gh-key","");$("brief").value=LS.get("gh-brief","");$("model").value=LS.get("gh-model","openai/gpt-oss-120b");$("klant").value=LS.get("gh-klant","care2cover");$("who").value=LS.get("gh-who2","Dean Dawson en Nico van Care2Cover");$("words").value=LS.get("gh-words","Luka Casier, Care2Cover, Dean, Nico, spuitkurk, crepi, kalei, steenstrips, gevelisolatie, configurator, Webflow, Poortbuilder");
if(!$("key").value||!$("brief").value)$("setup").open=true;
function saveSet(){$("key").value=$("key").value.replace(/\s+/g,"");LS.set("gh-key",$("key").value);LS.set("gh-brief",$("brief").value);LS.set("gh-model",$("model").value);LS.set("gh-words",$("words").value);LS.set("gh-who2",$("who").value);LS.set("gh-klant",slug());$("saved").textContent="Bewaard";if($("key").value&&$("brief").value.trim())$("setup").open=false;}
$("save").onclick=saveSet;$("model").onchange=saveSet;
$("clear").onclick=()=>{if(!confirm("Gesprekstekst en resultaten wissen? De briefing blijft."))return;lines=[];result={};LS.set("gh-lines","[]");LS.set("gh-result","{}");LS.set("gh-sess","");drawT();drawR();};
const fmt=ts=>new Date(ts).toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit"});
function persist(){LS.set("gh-lines",JSON.stringify(lines));if(typeof syncSheet==="function")syncSheet();}
function drawT(){const t=$("transcript"),i=$("interim");t.textContent="";lines.forEach(l=>{const d=document.createElement("div");const tm=document.createElement("time");tm.textContent=fmt(l.ts);d.append(tm,document.createTextNode((l.note?"[notitie] ":"")+l.text));t.append(d);});t.append(i);t.scrollTop=t.scrollHeight;}
function cards(el,arr,cls){el.textContent="";(arr||[]).forEach(x=>{const d=document.createElement("div");d.className="card"+(cls?" "+cls:"");d.textContent=x;el.append(d);});}
function list(el,arr){el.textContent="";if(!arr||!arr.length){const li=document.createElement("li");li.innerHTML="<small>Nog niets.</small>";el.append(li);return;}arr.forEach(x=>{const li=document.createElement("li");li.textContent=x;el.append(li);});}
function drawR(){if(result.next){cards($("next"),result.next);}cards($("say"),result.say,"say");$("tip").textContent=result.tip||"";list($("facts"),result.facts);list($("done"),result.done);list($("open"),result.open);}
drawT();drawR();

/* --- opname: blokjes van 30 s naar Groq Whisper --- */
const chunkMs=()=>parseInt($("chunk").value,10)*1000;
$("chunk").value=LS.get("gh-chunk","10");$("chunk").onchange=()=>LS.set("gh-chunk",$("chunk").value);
const JUNK=/^(ondertiteld|ondertiteling|bedankt voor het kijken|tot de volgende|amara|subtitles|\.+$)/i;
let stream=null,mr=null,want=false,chunkTimer=null,actx=null,an=null,peak=0,pending=0;
function uiRec(on){$("start").disabled=on;$("stop").disabled=!on;}
function setStatus(t,on){$("status").textContent=t;$("status").className=on?"on":"";}
function levelLoop(){if(!an)return;const b=new Uint8Array(an.fftSize);an.getByteTimeDomainData(b);let m=0;for(const v of b){m=Math.max(m,Math.abs(v-128));}peak=Math.max(peak,m);if(want)requestAnimationFrame(levelLoop);}
function newRecorder(){
  const mime=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"audio/webm";
  const parts=[];const r=new MediaRecorder(stream,{mimeType:mime});const t0=Date.now();peak=0;
  r.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data);};
  r.onstop=()=>{const loud=peak;if(want)newRecorder();if(loud<6)return;transcribe(new Blob(parts,{type:mime}),t0);};
  r.start();mr=r;clearTimeout(chunkTimer);chunkTimer=setTimeout(()=>{if(r.state==="recording")r.stop();},chunkMs());
}
async function transcribe(blob,t0){
  const key=$("key").value.trim();if(!key){$("setup").open=true;setStatus("Vul eerst je Groq-sleutel in.",want);return;}
  pending++;$("interim").textContent="(uitschrijven…)";
  try{
    const fd=new FormData();fd.append("file",blob,"stuk.webm");fd.append("model","whisper-large-v3");fd.append("language","nl");fd.append("temperature","0");
    const ctx=(lines.slice(-3).map(l=>l.text).join(" ")+" "+$("words").value).slice(-600);fd.append("prompt",ctx);
    const r=await fetch("https://api.groq.com/openai/v1/audio/transcriptions",{method:"POST",headers:{Authorization:"Bearer "+key},body:fd});
    const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||("fout "+r.status));
    const t=(j.text||"").trim();
    if(t&&!JUNK.test(t)){lines.push({ts:t0,text:t});lines.sort((a,b)=>a.ts-b.ts);persist();drawT();}
  }catch(e){setStatus("Uitschrijven lukte niet: "+e.message,want);}
  finally{pending--;if(!pending)$("interim").textContent="";}
}
$("start").onclick=async()=>{
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}
  catch(e){setStatus("Microfoon geweigerd: sta hem toe voor deze pagina.");return;}
  want=true;actx=new (window.AudioContext||window.webkitAudioContext)();an=actx.createAnalyser();an.fftSize=1024;actx.createMediaStreamSource(stream).connect(an);levelLoop();
  newRecorder();uiRec(true);setStatus("Neemt op",true);
};
$("stop").onclick=()=>{want=false;setTimeout(()=>syncSheet(true),8000);clearTimeout(chunkTimer);if(mr&&mr.state==="recording")mr.stop();setTimeout(()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(actx)actx.close();an=null;},300);uiRec(false);setStatus("Gestopt");};

/* --- opslag in Google Sheets (tabblad per klant) --- */
const SHEET_URL="https://script.google.com/macros/s/AKfycbxG9pz7vDGvQl-2hTOpTVDqITL8vdDhSrhvsLWKBK3a9t-1doEG5wv0FV1XNFgQx6p6/exec";
function slug(){return ($("klant").value||"algemeen").toLowerCase().trim().replace(/[^a-z0-9-]+/g,"-").replace(/^-|-$/g,"")||"algemeen";}
function sess(){let v=LS.get("gh-sess","");if(!v){const d=new Date();v=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");LS.set("gh-sess",v);}return v;}
const sheetId=()=>"gesprek-"+slug()+"-"+sess();
let syncT=null,lastSync=0;
function sheetRows(){const rows=[];lines.forEach((l,i)=>rows.push(["Gesprek",new Date(l.ts).toLocaleString("nl-BE"),(l.note?"[notitie] ":"")+l.text]));
  const r=result||{};[["Wat we al weten",r.facts],["Al beantwoord",r.done],["Nog open",r.open]].forEach(([t,a],i)=>{if(a&&a.length)rows.push(["Samenvatting",t,a.join("\n")]);});return rows;}
function syncSheet(now){clearTimeout(syncT);syncT=setTimeout(async()=>{
  try{await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({klant:sheetId(),state:{_ts:Date.now(),lines,result},pct:0,rows:sheetRows()})});lastSync=Date.now();$("sync").textContent="Opgeslagen in Google Sheets om "+fmt(lastSync);}
  catch(e){$("sync").textContent="Opslaan in Google Sheets mislukt, tekst staat wel nog op deze laptop";}
 },now?0:3000);}
async function restoreSheet(){if(lines.length)return;try{const r=await fetch(SHEET_URL+"?klant="+encodeURIComponent(sheetId()),{cache:"no-store"});const j=await r.json();const st=j&&j.state;if(st&&Array.isArray(st.lines)&&st.lines.length>lines.length){lines=st.lines;result=st.result||{};persist();LS.set("gh-result",JSON.stringify(result));drawT();drawR();}}catch(e){}}
restoreSheet();
window.addEventListener("beforeunload",()=>{try{navigator.sendBeacon(SHEET_URL,new Blob([JSON.stringify({klant:sheetId(),state:{_ts:Date.now(),lines,result},pct:0,rows:sheetRows()})],{type:"text/plain;charset=utf-8"}));}catch(e){}});

/* --- notities --- */
$("addnote").onclick=()=>{const v=$("note").value.trim();if(!v)return;lines.push({ts:Date.now(),text:v,note:true});persist();$("note").value="";drawT();ask();};
$("note").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();$("addnote").click();}});
const allText=()=>lines.map(l=>"["+fmt(l.ts)+"] "+(l.note?"[notitie] ":"")+l.text).join("\n");
$("copyall").onclick=async()=>{try{await navigator.clipboard.writeText(allText());$("status").textContent="Gekopieerd";}catch(e){$("status").textContent="Kopiëren lukte niet";}};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([allText()],{type:"text/plain"}));a.download="gesprek-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".txt";a.click();};

/* --- meedenken --- */
let busy=false,lastCount=-1;
async function ask(){
  const key=$("key").value.trim(),brief=$("brief").value.trim();
  if(!key||!brief){$("setup").open=true;$("status").textContent="Vul eerst de sleutel en de briefing in.";return;}
  if(busy)return;busy=true;$("now").disabled=true;$("status").textContent="Denkt mee…";
  const convo=allText()||"(het gesprek is nog niet begonnen)";
  const prompt=`Je helpt Luka LIVE tijdens een verkoopgesprek met een klant. De tekst van het gesprek is automatisch uitgeschreven uit West-Vlaams en kan fouten bevatten: lees door de fouten heen. Antwoord in Vlaams Nederlands, kort, concreet, in spreektaal.

BRIEFING (bedrijf, aanbod, vragen die we zeker willen stellen, prijzen; de prijzen zijn intern):
${brief}

ROLLEN: er zijn maar twee partijen. VRAAGSTELLER = Luka Casier (stelt de vragen, legt uit, toont de demo). KLANT = ${$("who").value} (behandel hen samen als één partij). De tekst bevat geen sprekers: leid uit de inhoud af of iets van de vraagsteller of van de klant komt. Feiten en antwoorden komen enkel van de klant, nooit uit de vragen of uitleg van Luka.

GESPREK TOT NU:
${convo}

Geef ENKEL geldige JSON, zonder uitleg, met:
- "next": 3 vragen die Luka NU best stelt, die logisch volgen op wat net gezegd is en op wat nog open staat; nooit iets vragen dat al beantwoord is,
- "say": 1 of 2 zinnen die Luka NU letterlijk kan zeggen (antwoord op een vraag of bezwaar van de klant, uitleg, of een bruggetje naar de volgende stap of de prijs volgens de briefing). Zelfzeker, je-vorm. Zeg nooit dat iets met AI gemaakt is,
- "tip": 1 korte zin over de aanpak op dit moment,
- "facts": max 10 korte feiten die de klant zei, met cijfers,
- "done": de vragen uit de briefing die al beantwoord zijn, kort, met het antwoord erbij (bv. "Aanvragen per maand: ±40"),
- "open": max 5 belangrijke vragen uit de briefing die nog open staan.`;
  try{
    const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json",Authorization:"Bearer "+key},body:JSON.stringify({model:$("model").value,temperature:0.4,max_tokens:2500,messages:[{role:"user",content:prompt}]})});
    const j=await r.json();
    if(!r.ok)throw new Error((j.error&&j.error.message)||("fout "+r.status));
    const txt=((j.choices||[])[0]||{}).message?.content||"";const m=txt.match(/\{[\s\S]*\}/);
    result=JSON.parse(m?m[0]:txt);LS.set("gh-result",JSON.stringify(result));drawR();syncSheet();lastCount=lines.length;
    $("status").textContent=(want?"Neemt op · ":"")+"bijgewerkt "+fmt(Date.now());$("status").className=want?"on":"";
  }catch(e){$("status").textContent="Meedenken lukte niet: "+e.message;}
  finally{busy=false;$("now").disabled=false;}
}
$("now").onclick=ask;
let tick=0;setInterval(()=>{tick++;if(!$("auto").checked||!want)return;if(tick>=parseInt($("every").value,10)){tick=0;if(lines.length!==lastCount)ask();}},1000);
</script>
</body></html>
